# more properties here: https://docs.spring.io/spring-boot/appendix/application-properties/index.html

# Common configurations for ALL profiles
spring:
  application:
    name: laboraAI
  profiles:
    active: dev

  ai:
    google:
      genai:
        api-key: ${SPRING_AI_GOOGLE_GENAI_API_KEY}
        chat:
          options:
            model: "gemini-2.5-flash" # always check model with some tokens to use the right one, e.g. "gemini-2.5-flash" or "gemini-2.5-pro"

